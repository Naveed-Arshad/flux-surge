<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flux Surge</title>
<style>
  :root{
    --bg: #0F0F14;
    --panel: #1A1A24;
    --gold: #6366F1;
    --teal: #8B5CF6;
    --ink: #F1F5F9;
    --ink-dim: #94A3B8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; height:100%;
    background: radial-gradient(120% 160% at 50% -10%, #1B1B2E 0%, #0F0F14 55%, #060609 100%);
    color: var(--ink); font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden; user-select: none;
  }
  
  #loginScreen { display: flex; align-items: center; justify-content: center; height: 100vh; }
  #gameScreen { display: none; }
  
  .login-box {
    background: var(--panel); border: 1px solid #333; padding: 32px;
    border-radius: 12px; text-align: center; max-width: 400px;
  }
  .login-box h1 { margin-bottom: 24px; font-size: 24px; }
  .login-box input { width: 100%; padding: 12px; margin-bottom: 16px;
    background: rgba(255,255,255,0.05); border: 1px solid #333; border-radius: 8px;
    color: var(--ink); font-size: 14px; }
  .login-box button { width: 100%; padding: 12px; background: var(--gold);
    color: #0F0F14; border: none; border-radius: 8px; font-weight: 700;
    font-size: 14px; cursor: pointer; }
  .login-box button:hover { opacity: 0.8; }
  .login-box .error { color: #EF4444; font-size: 12px; margin-top: 8px; }
  
  #app { max-width: 480px; margin: 0 auto; height: 100vh;
    display: flex; flex-direction: column; padding: 16px 18px 12px; position: relative; }

  .topbar { display:flex; align-items:center; justify-content: space-between; margin-bottom: 12px; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:800; font-size: 15px; }
  .brand .mark { width: 26px; height:26px; border-radius: 8px;
    background: linear-gradient(135deg, var(--gold), #7C3AED); display:flex;
    align-items:center; justify-content:center; font-size: 15px; }
  .level-pill { background: var(--panel); border: 1px solid #333; padding: 5px 12px;
    border-radius: 999px; font-size: 12px; color: var(--ink-dim); }
  .level-pill b { color: var(--teal); font-weight: 700; }

  .balance-block { text-align:center; margin: 8px 0; }
  .balance-label { font-size: 12px; color: var(--ink-dim); }
  .balance-value { font-size: 40px; font-weight: 800;
    display:flex; align-items:center; justify-content:center; gap: 8px; }
  .stat-row { display:flex; justify-content:center; gap: 14px;
    font-size: 11.5px; color: var(--ink-dim); margin-top: 3px; }
  .stat-row b { color: var(--teal); font-weight: 700; }

  .daily-strip { display:flex; align-items:center; justify-content: space-between;
    background: linear-gradient(90deg, #1e293b, #1a1a24);
    border: 1px solid #333; border-radius: 12px; padding: 8px 10px;
    margin: 8px 0; font-size: 12px; }
  .daily-strip button { border:none; border-radius: 9px; padding: 7px 12px;
    font-weight:700; font-size:12px; background: var(--gold); color:#0F0F14; cursor:pointer; }
  .daily-strip button:disabled { background:#444; color:#888; cursor:default; }

  .tap-zone { flex: 1; display:flex; flex-direction: column;
    align-items:center; justify-content:center; position: relative; }
  .tap-ring { width: min(56vw, 230px); height: min(56vw, 230px); border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #2b2f45 0%, #191b27 55%, #12141e 100%);
    border: 1px solid #333; box-shadow: 0 0 0 10px rgba(99,102,241,0.03),
    0 20px 50px rgba(0,0,0,0.55), inset 0 0 40px rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center;
    font-size: min(24vw, 100px); cursor: pointer; transition: transform 0.08s ease; }
  .tap-ring:active { transform: scale(0.94); }
  .tap-ring.depleted { filter: grayscale(0.6) brightness(0.7); cursor: not-allowed; }

  .float-pop { position: absolute; font-weight: 800; font-size: 20px;
    color: var(--gold); pointer-events: none;
    animation: floatUp 0.75s ease-out forwards; }
  @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1);}
    100% { opacity: 0; transform: translateY(-70px) scale(1.15);} }

  .energy-wrap { width: 100%; max-width: 300px; margin-top: 16px; }
  .energy-row { display:flex; justify-content: space-between; font-size: 11.5px;
    color: var(--ink-dim); margin-bottom: 4px; }
  .energy-bar { height: 8px; border-radius: 999px; background: #1e212f;
    border: 1px solid #333; overflow: hidden; }
  .energy-fill { height: 100%; background: linear-gradient(90deg, var(--teal), #7C3AED);
    border-radius: 999px; transition: width 0.25s ease; }

  .sheet { background: var(--panel); border: 1px solid #333;
    border-radius: 18px 18px 0 0; margin: 10px -18px -12px;
    padding: 12px 16px 16px; }
  .tabs { display:flex; gap: 6px; margin-bottom: 10px; }
  .tab { flex:1; text-align:center; padding: 7px 4px; font-size: 12px;
    font-weight:700; border-radius: 9px; background: #21243B33;
    color: var(--ink-dim); border: 1px solid #333; cursor:pointer; }
  .tab.active { background: var(--teal); color: #0F0F14; border-color: var(--teal); }

  .upgrade-list { display:flex; flex-direction: column; gap: 8px;
    max-height: 24vh; overflow-y: auto; }
  .upgrade { display:flex; align-items:center; gap: 12px;
    background: #21243B33; border: 1px solid #333; border-radius: 12px; padding: 9px 12px; }
  .upgrade .icon { width: 36px; height:36px; border-radius: 10px;
    background: #12141E; display:flex; align-items:center; justify-content:center;
    font-size: 18px; flex-shrink: 0; }
  .upgrade .info { flex: 1; min-width: 0; }
  .upgrade .name { font-size: 13px; font-weight: 700; }
  .upgrade .desc { font-size: 11px; color: var(--ink-dim); margin-top: 1px; }
  .upgrade button { border: none; border-radius: 10px; padding: 7px 11px;
    font-size: 12px; font-weight: 700; background: var(--gold); color: #0F0F14;
    display:flex; flex-direction: column; align-items:center; line-height: 1.2;
    min-width: 64px; cursor: pointer; transition: transform 0.1s ease; }
  .upgrade button:active { transform: scale(0.95); }
  .upgrade button:disabled { background: #444; color: #888; cursor: not-allowed; }
  .upgrade button span.lvl { font-size: 9.5px; opacity: 0.75; font-weight: 600; }

  .toast { position: absolute; top: 70px; left: 50%; transform: translateX(-50%) translateY(-10px);
    background: var(--teal); color: #0F0F14; font-weight: 800; font-size: 13px;
    padding: 9px 16px; border-radius: 12px; opacity: 0; pointer-events:none;
    transition: all 0.35s ease; z-index: 30; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-box">
    <h1>⚡ Flux Surge</h1>
    <p style="font-size: 14px; color: var(--ink-dim); margin-bottom: 24px;">Tap to earn coins!</p>
    <input type="text" id="usernameInput" placeholder="Enter username (3+ chars)" />
    <button onclick="login()">Play</button>
    <div class="error" id="errorMsg"></div>
  </div>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen">
  <div id="app">
    <div class="topbar">
      <div class="brand"><span class="mark">⚡</span> Flux Surge</div>
      <div class="level-pill">CEO Level <b id="level">1</b></div>
    </div>

    <div class="balance-block">
      <div class="balance-label">Total balance</div>
      <div class="balance-value"><span>💎</span><span id="coins">0</span></div>
      <div class="stat-row">
        <span id="perHour"></span>
        <span>Taps: <b id="totalTaps">0</b></span>
      </div>
    </div>

    <div class="daily-strip">
      <div style="display:flex; flex-direction:column;">
        <b>Daily reward</b>
        <span id="streakTxt" style="font-size: 11px; color: var(--ink-dim);">Day 1 streak</span>
      </div>
      <button id="claimBtn" onclick="claimDaily()">Claim</button>
    </div>

    <div class="tap-zone">
      <div class="toast" id="toast"></div>
      <div class="tap-ring" id="tapRing">⚡</div>
      <div class="energy-wrap">
        <div class="energy-row">
          <span>Energy</span>
          <span><b id="energyNow">100</b> / <span id="energyMax">100</span></span>
        </div>
        <div class="energy-bar"><div class="energy-fill" id="energyFill" style="width:100%"></div></div>
      </div>
    </div>

    <div class="sheet">
      <div class="tabs" id="tabs">
        <div class="tab active" data-cat="power">Tap Power</div>
        <div class="tab" data-cat="energy">Energy</div>
        <div class="tab" data-cat="auto">Auto-Trade</div>
      </div>
      <div class="upgrade-list" id="upgradeList">Loading...</div>
    </div>
  </div>
</div>

<script>
// Configuration
const API_URL = 'https://flux-surge-production.up.railway.app'; // Change after deploy
let userId = null;
let activeTab = 'power';
let gameState = {};

const UPGRADES = {
  grip:   { cat:'power',  name:'Better Grip',       icon:'🖐️', desc:'+1 coin per tap',            baseCost:50,  costMul:1.6 },
  gloves: { cat:'power',  name:'Pro Gloves',        icon:'🧤', desc:'+4 coins per tap',          baseCost:600, costMul:1.7 },
  tank:   { cat:'energy', name:'Energy Tank',       icon:'🔋', desc:'+30 max energy',            baseCost:80,  costMul:1.6 },
  regen:  { cat:'energy', name:'Fast Recharge',     icon:'⚡', desc:'+1 energy regen /sec',      baseCost:120, costMul:1.7 },
  bot:    { cat:'auto',   name:'Auto-Trader Bot',   icon:'🤖', desc:'+5 coins /sec passively',   baseCost:200, costMul:1.8 },
  team:   { cat:'auto',   name:'Night Shift Team',  icon:'🌙', desc:'+15 coins /sec passively',  baseCost:1500,costMul:1.85},
};

// Login
async function login() {
  const username = document.getElementById('usernameInput').value.trim();
  const errorEl = document.getElementById('errorMsg');
  
  if (username.length < 3) {
    errorEl.textContent = 'Username must be at least 3 characters';
    return;
  }
  
  try {
    const res = await fetch(`${API_URL}/api/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username })
    });
    
    const data = await res.json();
    if (!data.success) {
      errorEl.textContent = 'Login failed';
      return;
    }
    
    userId = data.user.id;
    gameState = data.user;
    
    // Show game screen
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'block';
    
    render();
    
    // Passive income tick every second
    setInterval(passiveTick, 1000);
    
    // Energy regen
    setInterval(regenEnergy, 1000);
    
    // Save periodically
    setInterval(saveGame, 10000);
    
  } catch (err) {
    errorEl.textContent = 'Connection error: ' + err.message;
  }
}

function fmt(n) {
  n = Math.floor(n);
  if (n >= 1e9) return (n/1e9).toFixed(2)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(2)+'M';
  if (n >= 1e3) return n.toLocaleString();
  return n.toString();
}

function render() {
  document.getElementById('coins').textContent = fmt(gameState.coins);
  document.getElementById('level').textContent = Math.max(1, Math.floor(Math.log2((gameState.totalEarned/100)+1)) + 1);
  document.getElementById('energyNow').textContent = Math.floor(gameState.energy);
  document.getElementById('energyMax').textContent = gameState.energyMax;
  document.getElementById('energyFill').style.width = (gameState.energy/gameState.energyMax*100)+'%';
  document.getElementById('perHour').textContent = gameState.passivePerSec > 0 ? ('+' + fmt(gameState.passivePerSec*3600) + '/hr') : '';
  document.getElementById('totalTaps').textContent = fmt(gameState.totalTaps || 0);
  document.getElementById('tapRing').classList.toggle('depleted', gameState.energy < 1);
  
  const today = new Date().toDateString();
  const claimedToday = gameState.lastClaimDate === today;
  document.getElementById('claimBtn').disabled = claimedToday;
  document.getElementById('streakTxt').textContent = 'Day ' + Math.max(1, gameState.streak || 0) + ' streak';
  
  renderUpgrades();
}

function renderUpgrades() {
  const list = document.getElementById('upgradeList');
  list.innerHTML = Object.entries(UPGRADES)
    .filter(([,u]) => u.cat === activeTab)
    .map(([id, u]) => {
      const level = 0;
      const cost = Math.round(u.baseCost * Math.pow(u.costMul, level));
      return `
        <div class="upgrade">
          <div class="icon">${u.icon}</div>
          <div class="info">
            <div class="name">${u.name}</div>
            <div class="desc">${u.desc}</div>
          </div>
          <button onclick="buyUpgrade('${id}')" ${gameState.coins < cost ? 'disabled' : ''}>
            💎 ${fmt(cost)}<span class="lvl">Lv ${level}</span>
          </button>
        </div>
      `;
    }).join('');
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  activeTab = tab.dataset.cat;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
  renderUpgrades();
});

async function tapGame() {
  if (gameState.energy < 1) return;
  
  try {
    const res = await fetch(`${API_URL}/api/tap`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, tapsCount: 1 })
    });
    
    const data = await res.json();
    gameState.coins = data.newBalance;
    gameState.energy = data.newEnergy;
    gameState.totalEarned = (gameState.totalEarned || 0) + data.coinsEarned;
    gameState.totalTaps = (gameState.totalTaps || 0) + 1;
    
    spawnFloat('+' + data.coinsEarned);
    render();
  } catch (err) {
    console.error(err);
  }
}

async function buyUpgrade(upgradeId) {
  try {
    const res = await fetch(`${API_URL}/api/buy-upgrade`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, upgradeId })
    });
    
    const data = await res.json();
    if (data.success) {
      gameState.coins = data.newBalance;
      showToast('✓ Upgrade purchased!');
      render();
    }
  } catch (err) {
    console.error(err);
  }
}

async function claimDaily() {
  try {
    const res = await fetch(`${API_URL}/api/claim-daily`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId })
    });
    
    const data = await res.json();
    if (data.success) {
      gameState.coins = data.newBalance;
      gameState.streak = data.streak;
      gameState.lastClaimDate = new Date().toDateString();
      showToast('🎁 +' + data.reward + ' reward!');
      render();
    }
  } catch (err) {
    console.error(err);
  }
}

async function passiveTick() {
  if (gameState.passivePerSec > 0) {
    try {
      const res = await fetch(`${API_URL}/api/passive-tick`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId })
      });
      
      const data = await res.json();
      gameState.coins += data.passiveEarned;
      gameState.totalEarned += data.passiveEarned;
      render();
    } catch (err) {}
  }
}

function regenEnergy() {
  if (gameState.energy < gameState.energyMax) {
    gameState.energy = Math.min(gameState.energyMax, gameState.energy + 0.016);
    render();
  }
}

async function saveGame() {}

function spawnFloat(text) {
  const rect = document.getElementById('tapRing').getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'float-pop';
  el.textContent = text;
  el.style.left = (rect.left + rect.width/2 - 10) + 'px';
  el.style.top = (rect.top + rect.height/2 - 20) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 800);
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1600);
}

document.getElementById('tapRing').addEventListener('click', tapGame);
</script>

</body>
</html>
